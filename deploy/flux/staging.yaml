apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fibonacci-staging
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: fibonacci
  path: ./deploy/kubernetes/overlays/staging
  prune: true
  wait: true
