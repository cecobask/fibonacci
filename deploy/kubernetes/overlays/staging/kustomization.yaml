apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fibonacci-staging

labels:
  - pairs:
      app.kubernetes.io/instance: fibonacci-staging

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/cecobask/fibonacci
    newTag: 0.1.1

replicas:
  - name: fibonacci
    count: 1

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fibonacci
      spec:
        template:
          spec:
            containers:
              - name: fibonacci
                env:
                  - name: LOG_LEVEL
                    value: debug
