apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fibonacci

labels:
  - pairs:
      app.kubernetes.io/instance: fibonacci

resources:
  - namespace.yaml
  - ../../base
  - horizontalpodautoscaler.yaml

images:
  - name: ghcr.io/cecobask/fibonacci
    newTag: 0.1.0

patches:
  # The HPA owns the replica count. Leaving spec.replicas set would make
  # every Flux reconciliation reset it.
  - target:
      kind: Deployment
      name: fibonacci
    patch: |
      - op: remove
        path: /spec/replicas
