name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build multi-arch image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make image-multiarch IMAGE="$IMAGE" VERSION="$VERSION"

      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | podman login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Push image
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          podman manifest push --all --digestfile digest.txt "$IMAGE:$VERSION"
          podman manifest push --all "$IMAGE:$VERSION" "$IMAGE:sha-${GITHUB_SHA::7}"
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE:$VERSION@$(cat digest.txt)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
